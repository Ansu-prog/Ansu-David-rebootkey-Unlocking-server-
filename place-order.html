<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#15171d">
  <title>Place Order — Rebootkey</title>
  <link rel="icon" href="assets/img/rebootkey-mark.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="assets/css/site.css" rel="stylesheet">
</head>
<body class="dashboard-body">
  <div class="dashboard-shell">
    <aside class="dashboard-sidebar">
      <div class="sidebar-brand"><img src="assets/img/rebootkey-mark.svg" width="36" height="36" alt=""><div><span class="brand-word">reboot<span>key</span></span></div></div>
      <nav class="sidebar-nav"><a href="dashboard.html"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></a><a href="my-orders.html"><i class="fa-solid fa-box"></i><span>My orders</span></a><a class="active" href="place-order.html"><i class="fa-solid fa-plus"></i><span>Place order</span></a><a href="wallet.html"><i class="fa-solid fa-wallet"></i><span>Wallet</span></a><a href="support-tickets.html"><i class="fa-solid fa-headset"></i><span>Support</span></a><a href="profile.html"><i class="fa-solid fa-user"></i><span>Profile</span></a></nav>
      <div class="sidebar-footer"><a href="index.html"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a></div>
    </aside>
    <main class="dashboard-main">
      <header class="dashboard-topbar"><div><span class="section-kicker">NEW ORDER</span><h1>Place a service request</h1></div><div class="topbar-actions"><a class="btn btn-link" href="my-orders.html">Back to orders</a></div></header>
      <section class="panel full-panel"><div class="panel-header"><h2>Request details</h2></div><form class="row g-3 mt-2" data-unconnected-form>
        <div class="col-md-6"><label class="form-label">Service category</label><select class="form-select"><option>IMEI services</option><option>File services</option><option>Server services</option><option>Remote support</option></select></div>
        <div class="col-md-6"><label class="form-label">Service package</label><select class="form-select"><option>IMEI unlock</option><option>Firmware download</option><option>Remote support</option></select></div>
        <div class="col-md-6"><label class="form-label">Device brand</label><input class="form-control" type="text" placeholder="e.g. Samsung"></div>
        <div class="col-md-6"><label class="form-label">Device model</label><input class="form-control" type="text" placeholder="e.g. Galaxy S24"></div>
        <div class="col-md-12"><label class="form-label">Notes</label><textarea class="form-control" rows="5" placeholder="Add device or service details."></textarea></div>
        <div class="col-12"><button class="btn btn-brand" type="submit">Review order</button><div class="form-message" aria-live="polite"></div></div>
      </form></section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/site.js" defer></script>
</body>
</html>
