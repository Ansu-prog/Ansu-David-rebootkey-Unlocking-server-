<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#15171d">
  <title>Forgot password — Rebootkey</title>
  <link rel="icon" href="assets/img/rebootkey-mark.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="assets/css/site.css" rel="stylesheet">
</head>
<body class="auth-page">
  <nav class="navbar navbar-dark site-nav"><div class="container"><a class="navbar-brand d-flex align-items-center gap-2" href="index.html"><img src="assets/img/rebootkey-mark.svg" width="40" height="40" alt=""><span class="brand-word">reboot<span>key</span></span></a><a class="btn btn-link nav-login" href="login.html"><i class="fa-solid fa-arrow-left me-2" aria-hidden="true"></i>Back to login</a></div></nav>
  <main id="main" class="auth-wrap"><div class="auth-card"><div class="auth-symbol"><img src="assets/img/rebootkey-mark.svg" width="52" height="52" alt=""></div><span class="section-kicker">PASSWORD RESET</span><h1>Forgot your password?</h1><p class="auth-intro">We’ll send a secure reset link when the backend email flow is connected.</p>
    <form data-unconnected-form novalidate><div class="mb-3"><label class="form-label" for="reset-email">Email address</label><input class="form-control" id="reset-email" type="email" required placeholder="you@example.com"><div class="invalid-feedback">Enter a valid email address.</div></div><button class="btn btn-brand w-100" type="submit">Send reset link</button><div class="form-message" aria-live="polite"></div></form>
    <p class="auth-switch"><a href="login.html">Return to log in</a></p>
  </div></main>
  <footer class="auth-footer"><a href="index.html">Rebootkey</a> · Authorized device services only.</footer>
  <script src="assets/js/site.js" defer></script>
</body>
</html>
