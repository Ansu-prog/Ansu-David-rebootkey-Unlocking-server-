<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#15171d">
  <title>Support Tickets — Rebootkey</title>
  <link rel="icon" href="assets/img/rebootkey-mark.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="assets/css/site.css" rel="stylesheet">
</head>
<body class="dashboard-body">
  <div class="dashboard-shell">
    <aside class="dashboard-sidebar">
      <div class="sidebar-brand"><img src="assets/img/rebootkey-mark.svg" width="36" height="36" alt=""><div><span class="brand-word">reboot<span>key</span></span></div></div>
      <nav class="sidebar-nav"><a href="dashboard.html"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></a><a href="my-orders.html"><i class="fa-solid fa-box"></i><span>My orders</span></a><a href="place-order.html"><i class="fa-solid fa-plus"></i><span>Place order</span></a><a href="wallet.html"><i class="fa-solid fa-wallet"></i><span>Wallet</span></a><a class="active" href="support-tickets.html"><i class="fa-solid fa-headset"></i><span>Support</span></a><a href="profile.html"><i class="fa-solid fa-user"></i><span>Profile</span></a></nav>
      <div class="sidebar-footer"><a href="index.html"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a></div>
    </aside>
    <main class="dashboard-main">
      <header class="dashboard-topbar"><div><span class="section-kicker">SUPPORT</span><h1>Support tickets</h1></div><div class="topbar-actions"><a class="btn btn-brand" href="support-tickets.html#new-ticket">New ticket</a></div></header>
      <section class="panel full-panel"><div class="panel-header"><h2>Open requests</h2></div><div class="table-responsive"><table class="data-table"><thead><tr><th>ID</th><th>Subject</th><th>Status</th><th>Updated</th></tr></thead><tbody><tr><td>#ST-203</td><td>Device verification</td><td><span class="status status-processing">In review</span></td><td>2026-11-13</td></tr><tr><td>#ST-198</td><td>Order clarification</td><td><span class="status status-completed">Resolved</span></td><td>2026-11-09</td></tr></tbody></table></div></section>
      <section class="panel full-panel" id="new-ticket"><div class="panel-header"><h2>Submit a ticket</h2></div><form class="row g-3 mt-2" data-unconnected-form><div class="col-md-6"><label class="form-label">Subject</label><input class="form-control" type="text"></div><div class="col-md-6"><label class="form-label">Ticket category</label><select class="form-select"><option>General support</option><option>Order issue</option><option>Billing</option><option>Remote support</option></select></div><div class="col-md-12"><label class="form-label">Details</label><textarea class="form-control" rows="5"></textarea></div><div class="col-12"><button class="btn btn-brand" type="submit">Send ticket</button><div class="form-message" aria-live="polite"></div></div></form></section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/site.js" defer></script>
</body>
</html>
